<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cartão Virtual</title>
    <style>
        :root {
            --bg-color: #e8f5e9; /* Verde suave */
            --form-bg: #ffffff;
            --primary-color: #2e7d32;
            --mint-card: #a3e4d7; /* Verde menta */
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--form-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(46, 125, 50, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            grid-column: span 2;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1b5e20;
        }

        /* Estilização do Cartão Virtual */
        .card-container {
            display: none;
            text-align: center;
        }

        .virtual-card {
            width: 100%;
            max-width: 380px;
            height: 220px;
            background: linear-gradient(135deg, #a3e4d7, #48c9b0); /* Verde menta degradê */
            color: #0e4d41;
            border-radius: 16px;
            padding: 20px;
            margin: 0 auto 20px auto;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            text-align: left;
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .card-chip {
            width: 40px;
            height: 30px;
            background: #d4ac0d;
            border-radius: 4px;
            margin-bottom: 5px;
        }

        .card-number {
            font-size: 20px;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 3px;
            margin: 10px 0;
            font-weight: bold;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .card-holder {
            font-size: 14px;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .card-info-label {
            font-size: 9px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .card-expires {
            font-size: 14px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        .btn-voltar {
            background-color: #555;
            margin-top: 15px;
        }
        .btn-voltar:hover {
            background-color: #333;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            button {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TELA 1: FORMULÁRIO DE CADASTRO -->
        <div id="form-container">
            <h2>Cadastro para Cartão Virtual</h2>
            <form id="cadastroForm" class="form-grid">
                <div class="form-group full-width">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" required placeholder="Digite seu nome completo">
                </div>

                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" required placeholder="000.000.000-00">
                </div>

                <div class="form-group">
                    <label for="nascimento">Data de Nascimento</label>
                    <input type="date" id="nascimento" required>
                </div>

                <div class="form-group">
                    <label for="renda">Renda Mensal (R$)</label>
                    <input type="number" step="0.01" id="renda" required placeholder="0,00">
                </div>

                <div class="form-group">
                    <label for="vencimento">Dia de Vencimento</label>
                    <select id="vencimento" required>
                        <option value="">Selecione o dia</option>
                        <option value="05">05</option>
                        <option value="15">15</option>
                        <option value="20">20</option>
                        <option value="30">30</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" required placeholder="00000-000">
                </div>

                <div class="form-group">
                    <label for="estadoCivil">Estado Civil</label>
                    <select id="estadoCivil" required>
                        <option value="">Selecione</option>
                        <option value="Solteiro(a)">Solteiro(a)</option>
                        <option value="Casado(a)">Casado(a)</option>
                        <option value="Divorciado(a)">Divorciado(a)</option>
                        <option value="Viúvo(a)">Viúvo(a)</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" required placeholder="Rua, Avenida, etc.">
                </div>

                <div class="form-group full-width">
                    <label for="complemento">Complemento</label>
                    <input type="text" id="complemento" placeholder="Apartamento, Bloco, Casa (Opcional)">
                </div>

                <button type="submit">Gerar Cartão Virtual</button>
            </form>
        </div>

        <!-- TELA 2: EXIBIÇÃO DO CARTÃO VIRTUAL -->
        <div id="card-container" class="card-container">
            <h2>Parabéns! Seu Cartão foi Gerado</h2>
            
            <div class="virtual-card">
                <div class="card-header">
                    <span>VIRTUAL CARD</span>
                    <span>VISA / MASTER</span>
                </div>
                <div>
                    <div class="card-chip"></div>
                    <div class="card-number" id="lblNumeroCartao">0000 0000 0000 0000</div>
                </div>
                <div class="card-footer">
                    <div>
                        <div class="card-info-label">Titular</div>
                        <div class="card-holder" id="lblNomeTitular">NOME DO CLIENTE</div>
                    </div>
                    <div>
                        <div class="card-info-label">Validade</div>
                        <div class="card-expires" id="lblValidade">09/2036</div>
                    </div>
                </div>
            </div>

            <button type="button" class="btn-voltar" onclick="voltarFormulario()">Fazer Novo Cadastro</button>
        </div>
    </div>

    <script>
        // Função para gerar número de cartão aleatório no formato XXXX XXXX XXXX XXXX
        function gerarNumeroCartao() {
            let bloco = () => Math.floor(1000 + Math.random() * 9000);
            return `${bloco()} ${bloco()} ${bloco()} ${bloco()}`;
        }

        // Manipulação do envio do formulário
        document.getElementById('cadastroForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Captura o nome digitado
            const nomeCliente = document.getElementById('nome').value;

            // Calcula a validade: 10 anos a partir do mês/ano atual
            const hoje = new Date();
            const mesAtual = String(hoje.getMonth() + 1).padStart(2, '0');
            const anoValidade = hoje.getFullYear() + 10;
            const validadeFormatada = `${mesAtual}/${anoValidade}`;

            // Preenche os dados no cartão virtual
            document.getElementById('lblNomeTitular').innerText = nomeCliente;
            document.getElementById('lblNumeroCartao').innerText = gerarNumeroCartao();
            document.getElementById('lblValidade').innerText = validadeFormatada;

            // Alterna a exibição das telas (esconde formulário, mostra o cartão)
            document.getElementById('form-container').style.display = 'none';
            document.getElementById('card-container').style.display = 'block';
        });

        // Função para resetar e voltar ao formulário
        function voltarFormulario() {
            document.getElementById('cadastroForm').reset();
            document.getElementById('card-container').style.display = 'none';
            document.getElementById('form-container').style.display = 'block';
        }
    </script>
</body>
</html>
